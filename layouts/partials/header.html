<header class="site-header">
  <div class="container header-inner">
    <a class="site-name" href="{{ "/" | relURL }}">{{ .Site.Params.author }}</a>
    <nav class="site-nav" aria-label="Main navigation">
      {{ range .Site.Menus.main }}
      <a class="nav-link{{ if or (eq $.RelPermalink .URL) (and (ne .URL "/") (hasPrefix $.RelPermalink .URL)) }} nav-link--active{{ end }}"
         href="{{ .URL }}">{{ .Name }}</a>
      {{ end }}
      {{ partial "theme-toggle.html" . }}
    </nav>
  </div>
</header>
